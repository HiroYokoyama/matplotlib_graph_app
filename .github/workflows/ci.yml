name: HYGrapher CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libegl1-mesa libgl1-mesa-glx libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-cov pytest-qt
          pip install -e "./hygrapher[dev]"

      - name: Run Pytest Suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pytest hygrapher/tests/ -v --cov=hygrapher

      - name: Run Pytest Suite (macOS & Windows)
        if: runner.os != 'Linux'
        run: |
          pytest hygrapher/tests/ -v --cov=hygrapher

      - name: Test Distribution Package Build
        run: |
          python -m build hygrapher

  publish:
    name: Build & Publish Package to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Distribution Packages
        run: |
          python -m build hygrapher

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: hygrapher/dist/
