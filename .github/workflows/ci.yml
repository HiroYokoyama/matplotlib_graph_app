name: HYGrapher CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e "./hygrapher[dev]"

      - name: Run Pytest Suite (Linux Headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run pytest hygrapher/tests/ -v --cov=hygrapher

      - name: Run Pytest Suite (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          pytest hygrapher/tests/ -v --cov=hygrapher

      - name: Test Wheel & Package Build
        run: |
          python -m build hygrapher
