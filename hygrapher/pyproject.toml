[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hygrapher"
version = "0.8.0"
authors = [
  { name="HiroYokoyama", email="titech.yoko.hiro@gmail.com" },
]
description = "A cross-platform GUI application for plotting CSV/Excel data with Matplotlib."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "pandas",
    "matplotlib",
    "numpy",
    "scipy",
    "PyQt6",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-qt",
    "build",
]

[project.urls]
Homepage = "https://github.com/HiroYokoyama/matplotlib_graph_app"
Issues = "https://github.com/HiroYokoyama/matplotlib_graph_app/issues"

[project.scripts]
hygrapher = "hygrapher.__main__:main"
hygrapher-3d = "hygrapher.main_3d:main"


